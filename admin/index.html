<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>白夜书 · 在线编辑</title>
<link rel="icon" href="/favicon.ico">
<style>
:root {
  --bg: #1b1d21; --panel: #23262b; --line: #34383f; --text: #d8dbe0;
  --dim: #8b919b; --accent: #72cecf; --pink: #ffbac3; --danger: #e06c75;
}
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; display: flex; flex-direction: column;
  font: 14px/1.6 Mulish, -apple-system, "PingFang SC", sans-serif;
  background: var(--bg); color: var(--text); }
button, input, select, textarea { font: inherit; color: inherit;
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; }
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #16181b; font-weight: 700; }
button.danger:hover { border-color: var(--danger); color: var(--danger); }
a { color: var(--accent); }
header { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { margin: 0 12px 0 0; font-size: 15px; font-weight: 700; color: var(--pink); }
header .spacer { flex: 1; }
main { flex: 1; display: flex; min-height: 0; }
#sidebar { width: 300px; flex: none; display: flex; flex-direction: column;
  border-right: 1px solid var(--line); min-height: 0; }
#sidebar .top { padding: 8px; display: flex; gap: 6px; }
#search { flex: 1; min-width: 0; }
#list { flex: 1; overflow: auto; }
#list .group { padding: 6px 10px 2px; font-size: 12px; color: var(--dim); }
#list .item { padding: 5px 10px 5px 18px; cursor: pointer; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
#list .item:hover { background: #2b2f35; }
#list .item.active { background: #2f3a3a; color: var(--accent); }
#editor { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#meta { padding: 10px 12px; border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: 80px 1fr 80px 1fr; gap: 6px 10px; align-items: center; }
#meta label { color: var(--dim); font-size: 13px; text-align: right; }
#meta .wide { grid-column: 2 / 5; }
#meta textarea { resize: vertical; min-height: 30px; }
#panes { flex: 1; display: flex; min-height: 0; }
#body { flex: 1; border: 0; border-radius: 0; resize: none; padding: 12px 14px;
  font-family: Inconsolata, ui-monospace, monospace; font-size: 14px; line-height: 1.7; }
#preview { flex: 1; overflow: auto; padding: 12px 18px; border-left: 1px solid var(--line);
  display: none; word-wrap: break-word; }
#preview.on { display: block; }
#preview img { max-width: 100%; }
#preview pre { background: #16181b; padding: 10px; overflow: auto; border-radius: 4px; }
#status { padding: 6px 12px; border-top: 1px solid var(--line); background: var(--panel);
  font-size: 13px; color: var(--dim); white-space: pre-wrap; }
#status.err { color: var(--danger); }
#status.ok { color: var(--accent); }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; width: min(460px, 92vw); }
dialog::backdrop { background: rgba(0, 0, 0, .6); }
dialog h2 { margin: 0 0 10px; font-size: 15px; }
dialog .row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
dialog .row span { color: var(--dim); font-size: 12px; }
dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
.hint { font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>白夜书 · 在线编辑</h1>
  <button id="btn-new">新建</button>
  <button id="btn-upload">插入图片</button>
  <button id="btn-preview">预览</button>
  <span class="spacer"></span>
  <button id="btn-login">登录 GitHub</button>
  <button id="btn-delete" class="danger">删除</button>
  <button id="btn-save" class="primary">保存并发布</button>
  <button id="btn-settings">设置</button>
</header>
<main>
  <aside id="sidebar">
    <div class="top">
      <input id="search" type="search" placeholder="搜索标题 / 路径">
      <button id="btn-refresh" title="重新拉取仓库文件列表">刷新</button>
    </div>
    <div id="list"></div>
  </aside>
  <section id="editor">
    <div id="meta">
      <label for="f-title">标题</label>
      <input id="f-title" class="wide">
      <label for="f-date">日期</label>
      <input id="f-date" placeholder="YYYY-MM-DD HH:mm:ss">
      <label for="f-cover">封面</label>
      <input id="f-cover" placeholder="留空则随机封面">
      <label for="f-tags">标签</label>
      <input id="f-tags" placeholder="逗号分隔：前端, 状态管理">
      <label for="f-cats">分类</label>
      <input id="f-cats" placeholder="计算机科学 / 编程知识 / 前端学习">
      <label for="f-desc">摘要</label>
      <input id="f-desc" class="wide">
      <label for="f-status">位置</label>
      <select id="f-status">
        <option value="_posts">文章（_posts）</option>
        <option value="_drafts">草稿（_drafts）</option>
      </select>
      <label for="f-dir">目录</label>
      <input id="f-dir" list="dirs" placeholder="computer-science/programming/front-end">
      <datalist id="dirs"></datalist>
      <label for="f-file">文件名</label>
      <input id="f-file" placeholder="Mobx.md">
      <label for="f-extra">其他</label>
      <textarea id="f-extra" class="wide" rows="1" placeholder="其余 front-matter（YAML），会原样保留"></textarea>
    </div>
    <div id="panes">
      <textarea id="body" spellcheck="false" placeholder="Markdown 正文…"></textarea>
      <div id="preview"></div>
    </div>
    <div id="status">未连接。点击「设置」填入 GitHub 仓库与访问令牌。</div>
  </section>
</main>
<input id="file-input" type="file" accept="image/*" hidden>

<dialog id="dlg-settings">
  <h2>连接设置</h2>
  <div class="row"><span>仓库 owner</span><input id="s-owner"></div>
  <div class="row"><span>仓库名（源码仓库，不是 Pages 仓库）</span><input id="s-repo"></div>
  <div class="row"><span>分支</span><input id="s-branch"></div>
  <div class="row">
    <span>授权 Worker 地址（如 https://nocturne-admin-auth.xxx.workers.dev）</span>
    <input id="s-auth" placeholder="https://…workers.dev">
  </div>
  <div class="row">
    <span>临时令牌（可选，应急用；留空则走上面的 GitHub 登录）</span>
    <input id="s-token" type="password" autocomplete="off">
  </div>
  <p class="hint">令牌只存在当前标签页的 sessionStorage，关掉标签页即失效，不写磁盘、不进仓库。
    仓库地址、Worker 地址等非敏感配置存在 localStorage。</p>
  <div class="actions">
    <button id="s-logout" class="danger">退出登录</button>
    <button id="s-cancel">取消</button>
    <button id="s-save" class="primary">保存并连接</button>
  </div>
</dialog>
<script type="module" src="./app.js"></script>
</body>
</html>
